    aliases: [ ]
  remove-balance:
    name: removebalance
    description: "Знімає гроші з балансу гравця"
    usage: "&cВикористання: /removebalance <гравець: string> <сума: number>"
    aliases: [ ]
  set-balance:
    name: setbalance
    description: "Встановлює баланс гравця"
    usage: "&cВикористання: /setbalance <гравець: string> <сума: number>"
    aliases: [ ]
