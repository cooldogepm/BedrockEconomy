balance.info: "&aВаш текущий баланс: &e{amount}&a. (#{position})"
balance.info.other: "&aТекущий баланс {player}: &e{amount}&a. (#{position})"

balance.pay: "&aВы перевели &f{amount}&a игроку {player}."
